[package]
name = "annota"
version = "0.1.0"
description = "Windows-first local knowledge tree reader and editor"
authors = ["Annota"]
edition = "2021"

[lib]
name = "annota_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Graphics_DirectWrite"] }
